<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Sklad — Поставка (layer 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet" />
<style>
  :root {
    --background: oklch(0.145 0.012 132.1);
    --foreground: oklch(0.9 0.021 131.5);
    --card: oklch(0.235 0.02 129.5);
    --primary: oklch(0.757 0.079 88.4);
    --primary-foreground: oklch(0.145 0.012 132.1);
    --primary-hover: oklch(0.819 0.09 88.1);
    --muted: oklch(0.235 0.02 129.5);
    --muted-foreground: oklch(0.721 0.037 130.6);
    --border: oklch(0.336 0.028 130.7);
    --control-border: oklch(0.538 0.055 130.8);
    --ring: oklch(0.87 0.08 88.4);
    --font: "Manrope", "Manrope Variable", -apple-system, system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font);
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  ::selection { background: oklch(0.87 0.08 88.4 / 30%); color: var(--foreground); }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .t-display, .t-label, .t-body, .t-caption, .t-data { margin: 0; }
  .t-display {
    font-size: 1.75rem; font-weight: 600; line-height: 1.1;
    letter-spacing: .05em; text-transform: uppercase; text-wrap: balance;
  }
  .t-label {
    font-size: .75rem; font-weight: 600; line-height: 1;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .t-body { font-size: 1rem; font-weight: 500; line-height: 1.5; text-wrap: pretty; }
  .t-caption {
    font-size: .875rem; font-weight: 400; line-height: 1.5;
    color: var(--muted-foreground); text-wrap: pretty;
  }
  .t-data {
    font-size: 1rem; font-weight: 400; line-height: 1.3;
    font-variant-numeric: tabular-nums;
  }
  .muted { color: var(--muted-foreground); }

  .top {
    max-width: 56rem; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px;
  }
  @media (min-width: 640px) { .top { padding: 16px 24px; } }
  .wordmark {
    font-size: 1.25rem; font-weight: 600; line-height: 1.15;
    letter-spacing: .05em; text-transform: uppercase; text-decoration: none;
  }
  .nav ul { display: flex; gap: 16px; margin: 0; padding: 0; list-style: none; }
  @media (min-width: 640px) { .nav ul { gap: 32px; } }
  .nav a {
    font-size: .75rem; font-weight: 600; line-height: 1;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted-foreground); text-decoration: none; transition: color .12s;
  }
  .nav a:hover { color: var(--foreground); }
  .nav a[aria-current="page"] { color: var(--foreground); }

  .shell {
    max-width: 56rem; margin: 0 auto;
    padding: 24px 16px 64px;
    display: flex; flex-direction: column; gap: 32px;
  }
  @media (min-width: 640px) { .shell { padding: 24px 24px 64px; } }

  .page-head { display: flex; flex-direction: column; gap: 12px; max-width: 42rem; }
  .backlink {
    display: inline-flex; align-items: center; gap: 6px; width: fit-content;
    padding: 4px 0; border: 0; background: none;
    font-size: .75rem; font-weight: 600; line-height: 1;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted-foreground); text-decoration: none; transition: color .12s;
  }
  .backlink:hover { color: var(--foreground); }
  .form { display: flex; flex-direction: column; gap: 32px; max-width: 42rem; }
  .section { display: flex; flex-direction: column; gap: 16px; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 560px) { .pair { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .field__label { color: var(--muted-foreground); }

  .input-group {
    display: flex; align-items: center; gap: 8px;
    height: 40px; border-bottom: 1px solid var(--control-border);
    transition: border-color .12s;
  }
  .input-group:focus-within { border-bottom-color: var(--ring); }
  .input-group input {
    flex: 1 1 auto; min-width: 0; height: 100%;
    padding: 4px 0; border: 0; background: transparent;
    font-size: 1rem; font-weight: 500; outline: none;
  }
  .input-group input::placeholder { color: var(--muted-foreground); font-weight: 400; }
  .input-group input:focus-visible { outline: none; }
  .input-group .unit { color: var(--muted-foreground); font-size: 1rem; white-space: nowrap; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

  .unit-cost {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 24px; padding-top: 4px;
  }
  .unit-cost__value {
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 2px; text-align: right;
  }
  .unit-cost__formula { color: var(--muted-foreground); font-size: .875rem; line-height: 1.5; }

  .actions {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 12px; flex-wrap: wrap;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 24px; white-space: nowrap;
    border: 1px solid transparent; border-radius: 0; background: transparent;
    font-size: .75rem; font-weight: 600; line-height: 1;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--foreground);
    transition: background-color .12s, color .12s, transform .08s;
  }
  .btn--primary { background: var(--primary); color: var(--primary-foreground); }
  .btn--primary:hover { background: var(--primary-hover); }
  .btn--primary:active { transform: translateY(1px); }
  .btn--ghost { color: var(--muted-foreground); }
  .btn--ghost:hover { background: var(--muted); color: var(--foreground); }

  .toast {
    position: fixed; left: 50%; bottom: 72px; z-index: 30;
    transform: translate(-50%, 12px); opacity: 0;
    max-width: calc(100vw - 32px); padding: 12px 16px;
    background: var(--card); color: var(--foreground);
    transition: opacity .12s, transform .12s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .proto {
    position: fixed; left: 16px; bottom: 16px; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    max-width: calc(100vw - 32px); padding: 8px 12px;
    background: var(--muted); color: var(--muted-foreground);
    font-size: .75rem; line-height: 1.3;
  }
  @media (max-width: 640px) {
    .proto { position: static; margin: 0 16px 16px; max-width: none; }
  }
  .proto__tag {
    font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--foreground); white-space: nowrap;
  }
  .proto__note { color: var(--muted-foreground); }
</style>
</head>
<body>

<header class="top">
  <a class="wordmark" href="#" aria-label="Sklad, на главную">Sklad</a>
  <nav class="nav" aria-label="Разделы">
    <ul>
      <li><a href="#">Настройки</a></li>
      <li><a href="#" aria-current="page">Материалы</a></li>
    </ul>
  </nav>
</header>

<main class="shell">
  <div class="page-head">
    <a class="backlink" href="#" id="back">← Материалы</a>
    <h1 class="t-display">Поставка</h1>
  </div>

  <form class="form" id="supply-form" novalidate>
    <div class="field">
      <label class="field__label t-label" for="material">Материал</label>
      <div class="input-group">
        <input id="material" name="material" type="search" value="Доска 40 мм" autocomplete="off" placeholder="Название, тип или вариант" />
      </div>
    </div>

    <section class="section" aria-labelledby="batch-label">
      <h2 class="t-label muted" id="batch-label">Партия</h2>
      <div class="pair">
        <div class="field">
          <label class="field__label t-label" for="quantity">Количество</label>
          <div class="input-group">
            <input id="quantity" name="quantity" type="number" inputmode="decimal" min="0.001" step="0.001" value="20" />
            <span class="unit" aria-hidden="true">м</span>
          </div>
        </div>
        <div class="field">
          <label class="field__label t-label" for="price">Цена закупки, всего</label>
          <div class="input-group">
            <input id="price" name="price" type="number" inputmode="decimal" min="0" step="any" value="12500" />
            <span class="unit" aria-hidden="true">₽</span>
          </div>
        </div>
      </div>
      <div class="unit-cost">
        <span class="t-label muted">Цена за единицу</span>
        <div class="unit-cost__value">
          <span class="t-data">625 ₽ / м</span>
          <span class="unit-cost__formula">12 500 ₽ ÷ 20 м</span>
        </div>
      </div>
    </section>

    <section class="section" aria-label="Поставщик и детали">
      <div class="field">
        <label class="field__label t-label" for="supplier">Поставщик</label>
        <div class="input-group">
          <input id="supplier" name="supplier" type="text" value="Столярный двор" autocomplete="off" />
        </div>
      </div>
      <div class="field">
        <label class="field__label t-label" for="description">Описание</label>
        <div class="input-group">
          <input id="description" name="description" type="text" value="Осенняя партия, сорт А" autocomplete="off" />
        </div>
      </div>
      <div class="field">
        <label class="field__label t-label" for="url">Ссылка</label>
        <div class="input-group">
          <input id="url" name="url" type="url" placeholder="https://…" autocomplete="off" />
        </div>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn btn--ghost" data-proto="cancel">Отмена</button>
      <button type="submit" class="btn btn--primary">Записать поставку</button>
    </div>
  </form>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="proto">
  <span class="proto__tag">прототип · слой 1</span>
  <span class="proto__note">статика: поиск и создание — следующими слоями</span>
</div>

<script>
(() => {
  "use strict";

  const toast = document.getElementById("toast");
  let timer;

  const say = (message) => {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove("show"), 2200);
  };

  const messages = {
    cancel: "Слой 4: возврат к материалам",
  };

  document.querySelectorAll("[data-proto]").forEach((control) => {
    control.addEventListener("click", () => say(messages[control.dataset.proto]));
  });

  document.getElementById("back").addEventListener("click", (event) => {
    event.preventDefault();
    say(messages.cancel);
  });

  document.getElementById("supply-form").addEventListener("submit", (event) => {
    event.preventDefault();
    say("Слой 4: здесь появится сохранение поставки");
  });
})();
</script>

</body>
</html>
